name: Khảo sát — chụp ảnh iPad 13 inch (Task 311)

# Task 311 (BLI 299): dựng ĐƯỜNG lấy ảnh chụp iPad cho hồ sơ App Store Connect. App Store
# Connect chỉ bắt buộc đúng MỘT khe "iPad - 13" Display", 2064×2752 px portrait / 2752×2064 px
# landscape (nguồn: developer.apple.com/help/app-store-connect/reference/
# screenshot-specifications, đọc 03/09/2026). Runner `macos-latest` (hiện = macOS 15 Arm64,
# github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md) có sẵn
# device type simulator "iPad Pro 13-inch (M4)" — độ phân giải gốc CHÍNH LÀ 2752×2064
# (support.apple.com/en-us/119891), khớp thẳng yêu cầu trên, không cần resize.
#
# CHỈ `workflow_dispatch` — KHÔNG trigger theo `push`/`pull_request`. Rào an toàn Task 311 cấm
# worker tự kích hoạt bất kỳ workflow build nào (PM giữ bước đó); workflow này chỉ DỰNG SẴN,
# PM tự bấm "Run workflow" khi muốn lấy bằng chứng thật. Build KHÔNG ký số, cho SIMULATOR
# (-sdk iphonesimulator) — không đụng ký số/phát hành/App Store Connect, không đụng
# build-ios.yml/release-testflight.yml hiện có.
#
# CHƯA ĐƯỢC CHẠY THỬ LẦN NÀO: máy KB không có Xcode/simulator để tự chạy cục bộ, và rào an
# toàn Task 311 cấm worker tự kích hoạt CI để thử — nên đây là "đường đã dựng theo tài liệu",
# CHƯA có bằng chứng chạy thật (xem comment kế hoạch Task 311). Lần chạy đầu tiên, đọc kỹ log
# từng bước — đặc biệt bước "Tạo simulator" (dò device type/runtime bằng chuỗi tên, có thể cần
# sửa nếu Apple đổi tên hiển thị).
on:
  workflow_dispatch:
    inputs:
      device_type_name:
        description: 'Tên hiển thị device type cần dò trong `xcrun simctl list devicetypes`'
        required: false
        default: 'iPad Pro 13-inch (M4)'

jobs:
  capture-ipad-screenshot:
    name: Build cho simulator + chụp ảnh iPad 13 inch
    runs-on: macos-latest
    steps:
      - name: Lấy mã nguồn (checkout)
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cài phụ thuộc npm (npm ci)
        run: npm ci

      - name: Sinh project iOS gốc (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: Cài CocoaPods cho project iOS
        working-directory: ios
        run: pod install

      - name: Xác định workspace và scheme Xcode
        id: ios-project
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build app cho simulator (xcodebuild -sdk iphonesimulator, KHÔNG ký số)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace "${{ steps.ios-project.outputs.workspace }}" \
            -scheme "${{ steps.ios-project.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Tìm .app vừa build cho simulator
        id: app-path
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products -iname "*.app" -path "*iphonesimulator*" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Không tìm thấy .app cho iphonesimulator trong build/Build/Products"
            exit 1
          fi
          echo "Đã tìm thấy: $APP_PATH"
          echo "app_path=ios/$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Tạo simulator (tự dò device type + runtime iOS mới nhất đã cài, không hard-code UUID)
        id: sim
        run: |
          DEVICE_TYPE=$(xcrun simctl list devicetypes \
            | grep -F "${{ inputs.device_type_name }}" \
            | grep -o 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]*' \
            | head -n1)
          if [ -z "$DEVICE_TYPE" ]; then
            echo "::error::Không tìm thấy device type '${{ inputs.device_type_name }}'. Xem 'xcrun simctl list devicetypes' và cập nhật input device_type_name."
            xcrun simctl list devicetypes
            exit 1
          fi
          echo "Device type: $DEVICE_TYPE"

          RUNTIME=$(xcrun simctl list runtimes \
            | grep -E "^iOS " \
            | tail -n1 \
            | grep -o 'com\.apple\.CoreSimulator\.SimRuntime\.[A-Za-z0-9.-]*')
          if [ -z "$RUNTIME" ]; then
            echo "::error::Không tìm thấy runtime iOS nào đã cài trên runner."
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Runtime: $RUNTIME"

          UDID=$(xcrun simctl create "CB-News-iPad13-Screenshot" "$DEVICE_TYPE" "$RUNTIME")
          echo "UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator và chờ sẵn sàng (bootstatus -b, đúng khuyến nghị dùng UDID cho CI)
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Cài và mở app CB News trên simulator
        run: |
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "${{ steps.app-path.outputs.app_path }}"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.cbcentres.cbnews

      # Task 312 vòng 2: chờ theo DẤU HIỆU nội dung đã ỔN ĐỊNH, không phải chỉ "đã xuất
      # hiện" và càng không phải số giây cố định. Vòng 1 chỉ dò tệp XUẤT HIỆN — ảnh run 2
      # (work item 312) lộ ra: dò xong lần tải ĐẦU vẫn có thể còn một lượt PHÂN TRANG đang
      # bay (10 bài/trang chỉ ra 5 hàng 2 cột, không lấp nổi khung iPad, `FlatList` phát
      # `onEndReached` gần như ngay lập tức) — ảnh chụp ngay sau khi thấy tệp lần đầu vẫn có
      # thể dính đúng vòng xoay đó. `homeLayout.ts` đã sửa để trang đầu tự lấp+tràn màn iPad
      # (giảm khả năng có lượt phân trang), nhưng CI không nên TIN suông là đã hết — dò tới
      # khi tệp `ci-home-ready.txt` NGỪNG đổi giá trị hai lượt dò liên tiếp (4s đứng yên) mới
      # coi là ổn định; app ghi đè tệp này ở MỌI lần một trang settle, kể cả phân trang (xem
      # `ciReadySignal.ts`), nên "còn lượt khác đang bay" tự lộ ra qua giá trị còn đổi.
      #
      # Task 318 (BLI 299): cổng trên vẫn chụp được màn TRỐNG hai lần trong bốn lần chạy —
      # log ghi "ổn định" trong khi danh sách bài rỗng, vì mốc thời gian đứng yên chỉ trả
      # lời "lần settle gần nhất là lúc nào", không trả lời "trên màn có bài để chụp chưa".
      # Tệp giờ mang `<số bài>:<mốc thời gian>` (`homeReadyMarker.ts`). Cổng dưới đây chỉ mở
      # khi CẢ HAI đúng: số bài (`${CUR%%:*}`, vế trước dấu ':') LỚN HƠN 0, VÀ toàn bộ giá
      # trị tệp không đổi hai lượt dò liên tiếp. Số bài bằng 0 KHÔNG được coi là ổn định dù
      # giá trị đứng yên — STABLE_COUNT reset về 0 trong trường hợp đó, chờ tiếp tới hết
      # trần. Việc này bịt cả họ nguyên nhân gốc (kể cả nguyên nhân chưa biết) vì mọi nguyên
      # nhân đều đi qua cùng một cửa: cổng mở lúc màn hình chưa có gì.
      #
      # Dò tệp qua `xcrun simctl get_app_container` (đường dẫn container thật trên máy
      # runner, lệnh chính thức Apple), KHÔNG dò log (ngưỡng log ở bản Release chưa đo được,
      # máy KB không có Xcode/simulator để kiểm — xem `ciReadySignal.ts`). Trần 80s bên dưới
      # là RÀO AN TOÀN chống treo workflow mãi, KHÔNG phải cơ chế chờ chính — hết trần mà
      # chưa ổn định (hoặc chưa từng thấy tệp, hoặc số bài không lớn hơn 0) thì FAIL bước
      # này, không chụp ảnh dở — nhưng chụp một ảnh CHẨN ĐOÁN trước khi fail (tên khác hẳn
      # ảnh nộp hồ sơ) để lần sau lỗi có ảnh mà xem, thay vì chỉ có log.
      - name: Chờ nội dung home ổn định (dò tệp đánh dấu tới khi ngừng đổi VÀ số bài > 0, không phải số giây cố định)
        run: |
          CONTAINER=$(xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" com.cbcentres.cbnews data)
          MARKER="$CONTAINER/Documents/ci-home-ready.txt"
          echo "Chờ tệp đánh dấu ổn định (số bài > 0 VÀ đứng yên 2 lượt liên tiếp): $MARKER"
          PREV=""
          STABLE_COUNT=0
          FOUND=0
          for i in $(seq 1 40); do
            if [ -f "$MARKER" ]; then
              FOUND=1
              CUR=$(cat "$MARKER")
              COUNT="${CUR%%:*}"
              # Số bài phải là số nguyên > 0 VÀ giá trị đứng yên so lượt trước — số bài 0
              # (hoặc tệp chưa đúng định dạng) luôn reset STABLE_COUNT, không bao giờ mở cổng.
              if echo "$COUNT" | grep -qE '^[0-9]+$' && [ "$COUNT" -gt 0 ] && [ "$CUR" = "$PREV" ]; then
                STABLE_COUNT=$((STABLE_COUNT + 1))
              else
                STABLE_COUNT=0
              fi
              PREV="$CUR"
              if [ "$STABLE_COUNT" -ge 2 ]; then
                echo "Nội dung ổn định sau lượt dò thứ ${i} (~$((i * 2))s), số bài: $COUNT, không đổi 2 lượt liên tiếp. Giá trị tệp: $CUR"
                exit 0
              fi
            fi
            sleep 2
          done
          # Hết trần mà chưa đạt — chụp ảnh CHẨN ĐOÁN trong lúc simulator còn sống (bước "Tắt
          # simulator" chưa chạy tới), tên khác hẳn ảnh nộp hồ sơ (ipad-13-inch-home.png) và
          # KHÔNG được lẫn vào chỗ đó. `|| true`: ảnh chẩn đoán chụp lỗi không được che mất
          # thông báo lỗi thật/exit 1 bên dưới.
          mkdir -p screenshots
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot screenshots/chan-doan-cho-that-bai.png || true
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Tệp $MARKER vẫn còn đổi giá trị hoặc số bài không lớn hơn 0 sau 80s (có thể vẫn đang phân trang liên tục, hoặc màn hình trống) — dừng, không chụp ảnh dở. Giá trị cuối: $PREV"
          else
            echo "::error::Sau 80s vẫn KHÔNG thấy $MARKER — home chưa báo tải xong nội dung. Dừng, không chụp ảnh có vòng xoay."
          fi
          exit 1

      - name: Chụp ảnh màn hình (độ phân giải điểm ảnh GỐC của thiết bị mô phỏng)
        run: |
          mkdir -p screenshots
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot screenshots/ipad-13-inch-home.png

      - name: Đo kích thước điểm ảnh vừa chụp (bằng chứng khớp 2064x2752 / 2752x2064 Apple yêu cầu)
        run: sips -g pixelWidth -g pixelHeight screenshots/ipad-13-inch-home.png

      - name: Tắt simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true

      - name: Lưu ảnh chụp làm artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb-news-ipad-13-inch-screenshot
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: warn
